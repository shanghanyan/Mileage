[pytest]
pythonpath = .
testpaths = tests
python_files = test_*.py
addopts = -q --tb=short
markers =
    chrome: Chrome Selenium tests (Ubuntu VPS only; requires REMOTE_SCRAPE=1)
    tor: Tor Firefox tests (Ubuntu VPS only; requires REMOTE_SCRAPE=1)
    unit: Fast unit tests (no browser)
filterwarnings =
    ignore::DeprecationWarning
