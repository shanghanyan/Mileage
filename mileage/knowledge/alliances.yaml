# Airline alliances + rare program→program transfers.
#
# Alliance membership lets the optimizer label paths with which metal you can
# book (e.g. Cap One → Aeroplan books Star Alliance, including United — even
# though Cap One has no direct United transfer). Charts still price the seat;
# this file only adds reachability metadata and optional second-hop edges.
#
# program_transfers: loyalty→loyalty point moves (not alliance booking).
# Most airline programs do NOT transfer out. Hotel→airline is the common case.
# These edges compound when the source program is already reachable from the
# user's currency (multi-hop: currency → A → B → SEAT).

alliances:
  star_alliance:
    name: Star Alliance
    source: "Star Alliance member airlines list"
    url: https://www.staralliance.com/en/member-airlines
    verified_at: "2026-08-18"
    programs:
      - aeroplan          # Air Canada
      - united            # United MileagePlus
      - turkish           # Turkish Miles&Smiles
      - lifemiles         # Avianca
      - ana               # ANA Mileage Club
      - krisflyer         # Singapore
      - eva               # EVA Infinity MileageLands
      - asiana            # Asiana Club
      - lufthansa         # Miles & More — the shared LH/LX/OS/SN/OU/LO ledger
      - copa              # ConnectMiles
      - air_china         # Phoenix Miles
      - air_india         # Maharaja Club
      - ethiopian         # ShebaMiles
      - egyptair          # EgyptAir Plus
      - thai              # Royal Orchid Plus
      - tap               # Miles&Go
      - air_new_zealand   # Airpoints
      # SAS is NOT here. It left Star Alliance on 2024-08-31 and joined SkyTeam
      # on 2024-09-01. It sat in this roster regardless, which made SAS metal
      # bookable with Aeroplan/United/Turkish miles and unbookable with
      # Flying Blue/Delta — exactly backwards. See the skyteam roster below.
      - aegean            # Miles+Bonus
      - brussels          # Miles & More (SN)
      - croatia           # Miles & More (OU)
      - lot               # Miles & More (LO)
      - shenzhen          # PhoenixMiles (ZH)
      - south_african     # Voyager
      - ita               # Volare — joined Star Alliance 2026-04
      # Asiana remains a member until 2024-12-17 -> 2026-12-17, when it fully
      # merges into Korean Air and moves to SkyTeam. Revisit before that date.

  skyteam:
    name: SkyTeam
    source: "SkyTeam member airlines list"
    url: https://www.skyteam.com/en/about/our-members
    verified_at: "2026-08-18"
    programs:
      - flying_blue       # Air France / KLM
      - delta             # SkyMiles
      - virgin_atlantic   # Flying Club — full member since 2023
      - aeromexico        # Club Premier
      - korean            # SKYPASS
      - china_eastern     # Eastern Miles
      - garuda            # GarudaMiles
      - saudi             # Alfursan
      - mea               # Cedar Miles
      - china_airlines    # Dynasty Flyer
      - vietnam           # Lotusmiles
      - kenya             # Asante Rewards
      - tarom             # Flying Blue (TAROM is a full SkyTeam member)
      - sas               # EuroBonus — MOVED here from Star Alliance 2024-09-01
      - aerolineas_argentinas  # Aerolineas Plus
      - air_europa        # SUMA
      - xiamen            # Egret Club
      # Aeroflot is NOT listed. SkyTeam suspended it in 2022 following the
      # invasion of Ukraine; it cannot fulfil membership obligations under
      # sanctions. A suspended member grants no bookable partner rights, and
      # listing it as active would let the engine route redemptions onto metal
      # nobody can actually ticket.

  oneworld:
    name: oneworld
    source: "oneworld member airlines list"
    url: https://www.oneworld.com/members
    verified_at: "2026-08-18"
    programs:
      - avios             # British Airways Executive Club (Avios)
      - iberia_plus       # Iberia Plus (Avios family — separate ledger + chart)
      - american          # AAdvantage
      - alaska            # Mileage Plan
      - cathay_pacific    # Asia Miles
      - qantas            # Frequent Flyer
      - finnair           # Finnair Plus
      - japan_airlines    # JAL Mileage Bank
      - malaysia          # Enrich
      - qatar             # Privilege Club
      - royal_jordanian   # Royal Plus
      - sri_lankan        # FlySmiLes
      - fiji              # Tabua Club
      - royal_air_maroc   # Safar Flyer
      - oman_air          # Sindbad

  # Non-aligned / independent programs we still track for transfers.
  independent:
    name: Independent
    source: "Non-aligned by definition — membership in no global alliance"
    verified_at: "2026-08-18"
    programs:
      # Aer Lingus LEFT oneworld in 2007 and never rejoined. AerClub is an
      # Avios-family ledger with BILATERAL booking rights, not alliance-wide
      # ones: reward flights on Aer Lingus, British Airways and American, plus
      # the IAG/AJB transatlantic joint business (adds Iberia and Finnair).
      # AerClub members do NOT get universal oneworld redemption.
      #
      # Listing it as oneworld gave it booking rights on all ~15 oneworld
      # carriers, which is how "Avios -> Aer Lingus AerClub [oneworld] on
      # Qantas" became rankable. See partners.yaml for the real carrier list.
      - aer_lingus_aerclub  # Aer Lingus AerClub (Avios family, non-aligned)
      - emirates          # Skywards
      - etihad            # Guest
      - jetblue           # TrueBlue
      - southwest         # Rapid Rewards
      - spirit            # Free Spirit
      - frontier          # Frontier Miles

# Loyalty→loyalty transfers (second and third hops). Ratios are points received
# per 1 source point. Secondary-sourced; re-verify before treating as
# authoritative.
#
# ARCHITECTURE §3: "airline → airline transfers are real and expanding: the
# Avios family now moves directly between seven programs, and mergers keep
# creating new edges." Without these rows the graph can only ever produce
# `bank → airline → seat`, which is a lookup table wearing a graph's clothing —
# and indeed twelve days of sweeps produced no multi-hop route at all, because
# the only program_transfers present started from hotel currencies nobody in
# the sweep held. These are the edges that make the search a search.
#
# `settlement_minutes` matters at booking time: award space can vanish while a
# transfer settles, and §6.1 uses it as the final tiebreak.
# `gates` are §4.1 requirements — annotations, never filters.
program_transfers:
  # --- Avios family -------------------------------------------------------- #
  # One currency, seven ledgers. Moves are 1:1 and near-instant, which is what
  # makes routing THROUGH a program to reach a better award chart worthwhile.
  - from: avios
    to: iberia_plus
    ratio: 1.0
    settlement_minutes: 0
    source: "Avios family — Combine My Avios (1:1 between household programs)"
    trust: 0.8
    updated_at: "2026-08-01"
    gates:
      # The classic silent route-killer: a brand-new Iberia Plus account cannot
      # send or receive Avios. Surfaced, never used to hide the route.
      - kind: accountAge
        program: iberia_plus
        min_days: 90
  - from: iberia_plus
    to: avios
    ratio: 1.0
    settlement_minutes: 0
    source: "Avios family — Combine My Avios"
    trust: 0.8
    updated_at: "2026-08-01"
    gates:
      - kind: accountAge
        program: iberia_plus
        min_days: 90
  - from: avios
    to: aer_lingus_aerclub
    ratio: 1.0
    settlement_minutes: 0
    source: "Avios family — Combine My Avios"
    trust: 0.8
    updated_at: "2026-08-01"
  - from: aer_lingus_aerclub
    to: avios
    ratio: 1.0
    settlement_minutes: 0
    source: "Avios family — Combine My Avios"
    trust: 0.8
    updated_at: "2026-08-01"
  - from: avios
    to: qatar
    ratio: 1.0
    settlement_minutes: 0
    source: "Avios family — Qatar Privilege Club Avios"
    trust: 0.75
    updated_at: "2026-08-01"
  - from: qatar
    to: avios
    ratio: 1.0
    settlement_minutes: 0
    source: "Avios family — Qatar Privilege Club Avios"
    trust: 0.75
    updated_at: "2026-08-01"
  - from: avios
    to: finnair
    ratio: 1.0
    settlement_minutes: 0
    source: "Avios family — Finnair Plus Avios"
    trust: 0.7
    updated_at: "2026-08-01"
  - from: iberia_plus
    to: qatar
    ratio: 1.0
    settlement_minutes: 0
    source: "Avios family — Combine My Avios"
    trust: 0.75
    updated_at: "2026-08-01"

  # Marriott Bonvoy → airlines (typical 3:1 = 0.333…). Useful when Marriott
  # is the user's currency OR an intermediate node later.
  - from: marriott_bonvoy
    to: aeroplan
    ratio: 0.333
