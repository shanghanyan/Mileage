# Airport reference — the single source of truth for IATA → region + position.
#
# ARCHITECTURE §9 puts this under data/reference/. It replaces the two parallel
# copies that used to live in charts.yaml (`region_map` and `airports`), which
# could drift apart: an airport could have a region but no coordinates, so a
# distance-banded chart silently refused to resolve for it.
#
# Fields per entry: [latitude, longitude, region]
#   region ∈ north_america | europe | north_asia | southeast_asia | south_asia
#          | middle_east | oceania | south_america | africa
#
# Coordinates are public airport positions rounded to 2dp. Award distance bands
# are hundreds-to-thousands of miles wide, so 2dp (~1km) is far more precision
# than any consumer needs.
#
# Coverage target: the world's busiest passenger airports plus every hub that a
# tracked carrier operates from, so an international query resolves rather than
# falling out of the region map.

