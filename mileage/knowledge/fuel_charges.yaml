# Fallback when a (currency, carrier) pair is absent entirely. Deliberately
# `moderate` rather than `none`: guessing zero understates the bill and makes an
# unknown look like a bargain. Rows produced this way are flagged
# `fuel_policy_unknown` so the uncertainty is visible, not buried.
default_policy: moderate
