# ARCHITECTURE §4.4 — carrier-imposed surcharges keyed on
# (award CURRENCY × OPERATING CARRIER).
#
# This is the file the whole product rests on. The key is deliberately NOT the
# program alone: the same British Airways Avios balance costs roughly $16 in
# surcharges on JAL metal and several hundred dollars on BA metal for the same
# alliance, same currency, same cabin. Keying on the program cannot express
# that difference, so a program-keyed table will confidently rank the worse
# redemption first.
#
# What the user sees ("price paid", §6.2) is:
#     government taxes + airport add-ons + carrier surcharge
# All three are ours, from this file and airports.yaml. None of them needs an
# external cash-fare feed — which is why §1 can put market-fare comparison out
# of scope and still show a dollar number.
#
# These are conservative curated estimates, not live tax quotes. Every number
# produced from this file is flagged `estimated_surcharge` and carries the
# confidence declared here. A live tax quote, when one exists, overrides it.

version: 1
updated_at: '2026-08-13'
confidence: 0.55

# --------------------------------------------------------------------------- #
# Policies — carrier surcharge by haul band, ECONOMY, one-way, USD cents.
# Haul bands come from domain/geo.py (short <1500mi, medium <3500, long <7000,
# ultra_long beyond).
# --------------------------------------------------------------------------- #
policies:
  none:
    label: No carrier surcharges
    note: >-
      Program does not pass carrier-imposed surcharges through on award
      tickets. You still owe government taxes.
    surcharge_cents: { short: 0, medium: 0, long: 0, ultra_long: 0 }

  minimal:
    label: Minimal carrier surcharges
    note: Token YQ/YR only — tens of dollars, not hundreds.
    surcharge_cents: { short: 300, medium: 900, long: 1600, ultra_long: 2000 }

  moderate:
    label: Moderate carrier surcharges
    surcharge_cents: { short: 1500, medium: 5000, long: 11000, ultra_long: 14000 }

  passes_full:
    label: Passes full carrier surcharges
    note: >-
      The award "costs" points AND a cash amount that can rival a discounted
      revenue fare. This is the failure mode the matrix exists to surface.
    surcharge_cents: { short: 4000, medium: 16000, long: 30000, ultra_long: 35000 }

# Carrier surcharges are levied per fare basis, so they scale with cabin.
cabin_multiplier:
  economy: 1.0
  premium_economy: 1.4
  business: 2.0
  first: 2.6

# --------------------------------------------------------------------------- #
# Government taxes + airport fees. Program-independent: owed on any award,
# in any currency, including the ones with a `none` surcharge policy.
# One-way, USD cents.
# --------------------------------------------------------------------------- #
taxes:
  default:
    short: { economy: 1400, premium_economy: 1600, business: 1800, first: 2000 }
    medium: { economy: 1800, premium_economy: 2100, business: 2400, first: 2700 }
    long: { economy: 4000, premium_economy: 4600, business: 5200, first: 5800 }
    ultra_long: { economy: 5000, premium_economy: 5600, business: 6400, first: 7000 }

# Per-airport add-ons that dominate the bill when the itinerary touches them.
# `levied_on: departure` matters — UK Air Passenger Duty is charged leaving the
# UK, so LHR→JFK carries it and JFK→LHR does not. Modeling it as
# non-directional overstates half of every transatlantic award by ~$216.
#
# The field is `levied_on`, NOT `on`: YAML 1.1 parses a bare `on` key as the
# boolean True, so `spec.get("on")` returned None and every tax silently became
# non-directional. The loader now rejects unknown keys rather than ignoring
# them, so the next such typo fails at load instead of skewing prices.
airport_taxes:
  LHR:
    levied_on: departure
    cents: { economy: 1700, premium_economy: 21600, business: 21600, first: 21600 }
    note: UK Air Passenger Duty — reduced rate economy, standard rate above it
  LGW:
    levied_on: departure
    cents: { economy: 1700, premium_economy: 21600, business: 21600, first: 21600 }
    note: UK Air Passenger Duty
  MAN:
    levied_on: departure
    cents: { economy: 1700, premium_economy: 21600, business: 21600, first: 21600 }
    note: UK Air Passenger Duty
  LCY:
    levied_on: departure
    cents: { economy: 1700, premium_economy: 21600, business: 21600, first: 21600 }
    note: UK Air Passenger Duty
  CDG:
    levied_on: departure
    cents: { economy: 2000, premium_economy: 4500, business: 6000, first: 6000 }
    note: French civil aviation + solidarity tax
  FRA:
    levied_on: departure
    cents: { economy: 1600, premium_economy: 4000, business: 5500, first: 5500 }
    note: German air transport tax
  MUC:
    levied_on: departure
    cents: { economy: 1600, premium_economy: 4000, business: 5500, first: 5500 }
    note: German air transport tax

# --------------------------------------------------------------------------- #
