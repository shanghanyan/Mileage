# Table 3 — SERVICE. Which carrier actually flies which city pair.
#
# ARCHITECTURE §2 sketches this as one file per carrier listing explicit
# {from, to, cabins} pairs. That shape does not survive contact with reality:
# ~50 carriers × a few thousand city pairs is tens of thousands of hand-entered
# rows that rot the moment a season changes, and nobody re-verifies them.
#
# Instead each carrier is described by what actually determines its network:
#   hubs   — the airports it builds its network around
#   serves — the regions it flies to FROM those hubs
#   routes — explicit pairs that the hub rule would miss or get wrong
#
# A carrier serves O↔D when either endpoint is one of its hubs and the other
# endpoint sits in a region it serves (or the pair is listed explicitly).
#
# HONESTY: a hub-rule match is an INFERENCE, not a verified schedule. Those
# edges carry the `service_inferred` flag and reduced confidence; explicit
# `routes` entries carry `service_verified`. The engine never presents an
# inferred edge as a confirmed schedule — see domain/service.py.
#
# This is Table 3: version-controlled, human-reviewed. Scrapers never write it.

version: 1
updated_at: '2026-08-13'

# Cabins a carrier offers on intra-region flying, when it differs from its
# long-haul product. Almost nobody flies a true first-class cabin domestically.
default_intra_cabins: [economy, business]

carriers:
  # ------------------------------------------------------------------ oneworld
  JL:
    name: Japan Airlines
    program: japan_airlines
    alliance: oneworld
    hubs: [HND, NRT, KIX, ITM]
    serves: [north_asia, southeast_asia, north_america, europe, oceania, south_asia]
    cabins: [economy, premium_economy, business, first]
    routes:
      # The canonical short-haul Avios sweet spot (ARCHITECTURE §11 demo).
      - { from: HND, to: ITM, cabins: [economy, business] }
      - { from: HND, to: CTS, cabins: [economy, business] }
      - { from: HND, to: FUK, cabins: [economy, business] }
      - { from: HND, to: OKA, cabins: [economy, business] }
      - { from: NRT, to: KIX, cabins: [economy, business] }

  BA:
    name: British Airways
    program: avios
    alliance: oneworld
    hubs: [LHR, LGW, LCY]
    serves: [europe, north_america, north_asia, southeast_asia, south_asia,
             middle_east, africa, south_america, oceania]
    cabins: [economy, premium_economy, business, first]

