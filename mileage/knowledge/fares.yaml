# Curated FALLBACK cash fares (Layer 2), US cents, one-way.
#
# Emitted flagged `hardcoded_fallback` at low trust — never `recommended`.
#
# IMPORTANT: a missing entry here is NOT an error. ARCHITECTURE §1 puts
# market-fare comparison out of scope for v1, and since the fuel-charge matrix
# (§4.4) prices "price paid" from our own tables, a route with no fare still
# returns a full ranked list — it just omits the cents-per-point column. These
# rows are an enrichment, not a prerequisite. The pipeline used to treat a gap
# here as a hard error and discard an already-computed ranking; it no longer
# does, so this file can grow lazily instead of urgently.
#
