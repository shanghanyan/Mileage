# ARCHITECTURE §4.5 — PARTNER RIGHTS. Which carriers a currency may book.
#
# Kept separate from Table 3 on purpose:
#   service (carriers.yaml) says WHO FLIES the city pair.
#   partner rights (this file) says WHO IS ALLOWED TO BOOK it.
# A route must satisfy both. Collapsing them loses real cases in each
# direction — a carrier that flies the pair but isn't bookable with your
# currency, and a bookable partner that doesn't serve the pair at all.
#
# Most rights follow alliance membership, so that is the default and only the
# departures from it are enumerated. `extra` adds non-alliance partnerships;
# `excluded` removes alliance members a program genuinely cannot book.

version: 1
updated_at: '2026-08-13'

# When true, a program can book every carrier in its own alliance. Departures
# are listed per-currency below.
alliance_grants_booking: true

currencies:
  # --- oneworld ------------------------------------------------------------ #
  avios:
    alliance: oneworld
    # Avios is a shared currency across the BA/IB/EI/Qatar/Finnair family.
    extra: [AS]
    note: >-
      Alaska joined oneworld, so AS is bookable; listed explicitly because the
      Avios family also has a direct AS partnership independent of alliance.

  iberia_plus:
    alliance: oneworld
  american:
    alliance: oneworld
    extra: [EY]
  alaska:
    alliance: oneworld
    # LH REMOVED: Lufthansa is not, and was not, a Mileage Plan redemption
    # partner. Alaska's only Lufthansa Group relationship is ITA Airways, added
    # in Jan 2026 as EARN-only — you can collect Alaska miles on it, not spend
    # them. Earn-only partners must never appear here: this file answers "who
    # may I BOOK", and an earn partner listed as bookable invents itineraries.
    extra: [EK, SQ, KE]
    note: >-
      Mileage Plan keeps several non-oneworld redemption partners from before it
      joined — these are real and are why AS is often the cheapest way onto that
      metal. Redemption partners only; earn-only partners are excluded by design.
  cathay_pacific:
    alliance: oneworld
  qatar:
    alliance: oneworld
  qantas:
    alliance: oneworld
    extra: [EK]
  finnair:
    alliance: oneworld
  japan_airlines:
    alliance: oneworld
    extra: [EK]
  malaysia:
    alliance: oneworld

  # --- Star Alliance ------------------------------------------------------- #
  united:
    alliance: star_alliance
  aeroplan:
    alliance: star_alliance
    extra: [EY, EK, CI]
  turkish:
    alliance: star_alliance
  lifemiles:
    alliance: star_alliance
    extra: [EK]
  krisflyer:
    alliance: star_alliance
    # VS REMOVED: same 2025-04-23 termination as the virgin_atlantic entry
    # below. A partnership ending is bidirectional — leaving it on one side
    # only would have let KrisFlyer book Virgin metal while Virgin could not
    # book Singapore, an asymmetry that exists nowhere in reality.
  ana:
    alliance: star_alliance
    extra: [EK, VS]
  asiana:
    alliance: star_alliance
  eva:
    alliance: star_alliance
  thai:
    alliance: star_alliance
  lufthansa:
    # Miles & More. One entry, not one per operating carrier.
    alliance: star_alliance
  tap:
    alliance: star_alliance
  copa:
    alliance: star_alliance
  ethiopian:
    alliance: star_alliance
  egyptair:
    alliance: star_alliance
  air_india:
    alliance: star_alliance
  air_china:
    alliance: star_alliance
  air_new_zealand:
    alliance: star_alliance

  # --- SkyTeam ------------------------------------------------------------- #
  delta:
    alliance: skyteam
  flying_blue:
    alliance: skyteam
  virgin_atlantic:
    alliance: skyteam
    # SQ REMOVED: the Virgin Atlantic / Singapore Airlines partnership ended
    # 2025-04-23 — no new reward bookings after that date. ANA survives and is
    # still one of Flying Club's best redemptions. Flying Club's partner list
    # has contracted sharply (Singapore and Hawaiian both gone), so this entry
    # needs re-verifying more often than most.
    extra: [NH]
    note: Flying Club retains its ANA partnership outside SkyTeam.
  korean:
    alliance: skyteam
  sas:
    # EuroBonus moved to SkyTeam on 2024-09-01. Listed here, not in the Star
    # Alliance block above, so SAS metal prices from the right currencies.
    alliance: skyteam
  china_airlines:
    alliance: skyteam
  china_eastern:
    alliance: skyteam
  aeromexico:
    alliance: skyteam
  vietnam:
    alliance: skyteam
  saudi:
    alliance: skyteam
  kenya:
    alliance: skyteam

  # --- Independent --------------------------------------------------------- #
  aer_lingus_aerclub:
    alliance: independent
    # Aer Lingus left oneworld in 2007. AerClub's redemption rights are
    # bilateral, NOT alliance-wide: Aer Lingus, British Airways and American
    # for reward flights, plus Iberia and Finnair through the IAG/American
    # transatlantic joint business. Enumerated in full because `independent`
    # grants nothing by default — which is the point. When this said
    # `alliance: oneworld`, AerClub inherited booking rights on every oneworld
    # carrier (Qantas, Cathay, JAL, Malaysia, …) and the engine ranked
    # "Avios -> AerClub on Qantas" as a real, bookable itinerary.
    extra: [EI, BA, AA, IB, AY]
    note: >-
      Bilateral + IAG/AJB joint-business rights only. AerClub members do not
      get universal oneworld redemption or reciprocal tier benefits across the
      full alliance.

  emirates:
    alliance: independent
    extra: [EK, QF, AS, JL]
  etihad:
    alliance: independent
    extra: [EY, AA, VS]
  jetblue:
    alliance: independent
    extra: [B6, EI, QR, SQ, EK]
  southwest:
    alliance: independent
    extra: [WN]
