# RSS/Atom feeds for award chart data — polled in parallel with HTTP scraping.
# Prefer feeds from sites that bot-block live pages (10xTravel, OMAAT, etc.).
# Keywords filter entries to the relevant program before parsing.

lifemiles:
  - url: "https://10xtravel.com/feed/"
    keywords: [lifemiles, avianca, "life miles"]
