<script>
        // Simple micro-interaction for the year wheel centering
        const wheel = document.querySelector('.no-scrollbar');
        wheel.addEventListener('scroll', () => {
            const items = wheel.querySelectorAll('.snap-center');
            const centerX = wheel.scrollLeft + wheel.offsetWidth / 2;
            
            items.forEach(item => {
                const itemCenter = item.offsetLeft + item.offsetWidth / 2;
                const distance = Math.abs(centerX - itemCenter);
                
                if (distance < 50) {
                    item.classList.add('active-wheel-item', 'text-primary');
                    item.classList.remove('text-outline', 'opacity-40');
                } else {
                    item.classList.remove('active-wheel-item', 'text-primary');
                    item.classList.add('text-outline', 'opacity-40');
                }
            });
        });

        // Initialize scroll position
        window.addEventListener('load', () => {
            const activeItem = document.querySelector('.active-wheel-item');
            if (activeItem) {
                const scrollLeft = activeItem.offsetLeft - (wheel.offsetWidth / 2) + (activeItem.offsetWidth / 2);
                wheel.scrollTo({ left: scrollLeft, behavior: 'auto' });
            }
        });
    </script>
